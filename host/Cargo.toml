[package]
name = "pearl-host"
version = "1.0.0"
edition = "2021"
description = "Minero de Pearl (PRL) para GPUs NVIDIA — stratum v2 + motor CUDA"
license = "MIT"

[dependencies]
blake3 = "1.8"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"
libloading = "0.8"
pearl-blake3 = { path = "../native/pearl-blake3", features = ["serde"] }

[[bin]]
name = "pearl-host"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
